services:
  nats:
    image: nats:2.11.4
    restart: always
    container_name: nats
    ports:
      - "4222:4222"  # Client port
      - "8222:8222"  # HTTP management port
    command:
      - -config
      - /conf/nats.conf
    volumes:
      - ./nats-data-file:/nats  # Persistent storage for JetStream
      - ./nats.conf:/conf/nats.conf # Configuration file